services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - app-network
    environment:
      - VITE_API_BACKEND=/api/

  server:
    env_file:
      - server/.env
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://root:root@host.docker.internal:3306/eventsUaviak?connection_limit=5&connect_timeout=30
      - PRISMA_CLI_QUERY_ENGINE_TYPE=binary
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - VITE_API_BACKEND=http://localhost:3000/api/
      - CORS_ORIGIN=http://localhost:80
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy


  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=eventsUaviak
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysql", "-u", "root", "-proot", "-e", "SELECT 1 FROM DUAL WHERE EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = 'eventsUaviak');"]
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge 